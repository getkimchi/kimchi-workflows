name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: dist-metadata
            run: pnpm run dist:check
            node-version: '24'
          - check: lint
            run: pnpm run lint
            node-version: '24'
          - check: typecheck
            run: pnpm run typecheck
            node-version: '24'
          - check: test
            run: pnpm run test
            node-version: '24'
          - check: check (node 22)
            run: pnpm run check
            node-version: '22.19'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.run }}

  examples:
    name: examples (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install example dependencies
        run: pnpm --dir examples --ignore-workspace install --frozen-lockfile

      - name: Typecheck examples
        run: pnpm run typecheck:examples

      - name: Test examples
        run: pnpm run test:examples

  kimchi-binary-e2e:
    name: Kimchi binary E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out kimchi-workflows
        uses: actions/checkout@v4
        with:
          path: kimchi-workflows

      - name: Check out Kimchi harness master
        uses: actions/checkout@v4
        with:
          repository: getkimchi/kimchi
          ref: master
          path: kimchi
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: kimchi/tools/proxy-helper/go.mod
          cache-dependency-path: kimchi/tools/proxy-helper/go.sum

      - name: Install kimchi-workflows dependencies
        working-directory: kimchi-workflows
        run: pnpm install --frozen-lockfile

      - name: Install Kimchi dependencies
        working-directory: kimchi
        run: pnpm install --frozen-lockfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: '1.4.0'

      - name: Build Kimchi proxy helper
        working-directory: kimchi
        run: node scripts/build-proxy-helper.js

      - name: Build Kimchi Bun binary
        working-directory: kimchi
        run: pnpm run build:binary

      - name: Run compiled-harness workflow E2E
        working-directory: kimchi-workflows
        env:
          KIMCHI_E2E_BINARY: ${{ github.workspace }}/kimchi/dist/bin/kimchi
          KIMCHI_E2E_PACKAGE_DIR: ${{ github.workspace }}/kimchi/dist/share/kimchi
        run: pnpm run test:e2e:kimchi
