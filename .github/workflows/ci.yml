name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: dist-metadata
            run: pnpm run dist:check
            node-version: '24'
          - check: lint
            run: pnpm run lint
            node-version: '24'
          - check: typecheck
            run: pnpm run typecheck
            node-version: '24'
          - check: test
            run: pnpm run test
            node-version: '24'
          - check: check (node 22)
            run: pnpm run check
            node-version: '22.19'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.run }}

  examples:
    name: examples (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install example dependencies
        run: pnpm --dir examples --ignore-workspace install --frozen-lockfile

      - name: Typecheck examples
        run: pnpm run typecheck:examples

      - name: Test examples
        run: pnpm run test:examples
